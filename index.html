<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Cirtot</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:15px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:10px;
}

input,select{
width:100%;
padding:10px;
margin-bottom:10px;
}

button{
width:100%;
padding:12px;
background:orange;
border:none;
color:white;
font-size:16px;
border-radius:8px;
}

.member{
background:#eee;
padding:10px;
margin-top:10px;
border-radius:8px;
}
</style>
</head>

<body>

<h1>🔥 Member Cirtot 🔥</h1>

<div class="card">

<h3>Paket 1 - Rp25.000</h3>

<ul>
<li>Gratis 1 cireng setiap hari</li>
<li>Dapat stiker</li>
</ul>

<h3>Paket 2 - Rp200.000</h3>

<ul>
<li>Folback akun TikTok Cirtot</li>
<li>Gratis 1 cireng setiap hari</li>
<li>Potbar bersama owner</li>
</ul>

</div>

<div class="card">

<input type="text" id="nama" placeholder="Nama Member">

<select id="paket">
<option>Paket 1</option>
<option>Paket 2</option>
</select>

<button onclick="tambahMember()">
Tambah Member
</button>

</div>

<div class="card">

<h3>Daftar Member</h3>

<div id="hasil"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA8gKMCuV1AwuLx3B7j9BuSSqd4sfzegAU",
  authDomain: "cirtot-member.firebaseapp.com",
  projectId: "cirtot-member",
  storageBucket: "cirtot-member.firebasestorage.app",
  messagingSenderId: "166354013678",
  appId: "1:166354013678:web:69fd3e49765db6023f52ff"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.tambahMember = async function(){

  let nama = document.getElementById("nama").value;
  let paket = document.getElementById("paket").value;

  if(nama==""){
    alert("Isi nama dulu bre");
    return;
  }

  await addDoc(collection(db, "members"), {
    nama: nama,
    paket: paket,
    tanggal: new Date().toISOString()
  });

  document.getElementById("nama").value = "";

  alert("Member berhasil disimpan!");

  tampil();
}

async function tampil(){

  let html = "";

  const querySnapshot = await getDocs(collection(db, "members"));

  querySnapshot.forEach((doc) => {

    const m = doc.data();

    html += `
    <div class="member">
      <b>${m.nama}</b><br>
      ${m.paket}
    </div>
    `;

  });

  document.getElementById("hasil").innerHTML = html;
}

tampil();

</script>

</body>
</html>
